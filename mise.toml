# mise: the pinned tools of this repository and its commands. One entry point for developers, agents and CI.
#   mise install            install exactly these tool versions (once, and after this file changes)
#   mise tasks              list the commands
#   mise run <task> ...     run one

[tools]
gitleaks = "8.30.1"   # lint:leaks: the secret scan of the whole history (.gitleaks.toml)
actionlint = "1.7.12"   # lint:leaks: the GitHub workflows
shellcheck = "0.11.0"   # actionlint checks the run: scripts with it
go = "1.27.4"
python = "3.14"

[tasks.test]
description = "The unit tests of the scripts and the static example program"
run = ["python3 -m unittest discover -s tests -v", "go run $(find tasks/static/files -name welcome.go)"]

[tasks.package]
description = "Build the exercise archives into dist/"
run = "python3 tools/package.py"

[tasks.build]
description = "Build the image of the dynamic exercises (Docker)"
run = "docker build -f tasks/dynamic/Dockerfile -t cybericebox/test-exercises:local ."

[tasks.smoke]
description = "Build the test tools image and run the smoke test against the local image (Docker)"
run = [
  "docker build -f tasks/dynamic/Dockerfile --target test-tools -t cib-test-exercises:tools .",
  "CIB_DEMO_IMAGE=cybericebox/test-exercises:local python3 tools/smoke.py",
]

[tasks."lint:leaks"]
description = "gitleaks over the whole history (.gitleaks.toml) and actionlint over the workflows"
run = ["gitleaks git --redact --no-banner --log-level warn", "actionlint"]

[tasks.lint]
description = "The lints of this repository"
run = [{ task = "lint:leaks" }]
