name: Verify and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - run: make test package
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cybericebox/daemon
          ref: ab23a5317e3fbec465439d20094d02d842c84f7d
          path: _platform
      - run: DAEMON_SOURCE="$GITHUB_WORKSPACE/_platform" bash scripts/validate-platform.sh
      - name: Check release image pin
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release.py
  runtime:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -f dynamic/Dockerfile -t cib-test-exercises:local .
      - run: docker build -f dynamic/Dockerfile --target test-tools -t cib-test-exercises:tools .
      - run: python3 scripts/smoke.py
  publish:
    timeout-minutes: 25
    if: startsWith(github.ref, 'refs/tags/')
    needs: [contract, runtime]
    runs-on: ubuntu-latest
    concurrency:
      group: docker-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: dynamic/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            cybericebox/test-exercises:${{ github.ref_name }}
            cybericebox/test-exercises:latest
          labels: |
            org.opencontainers.image.source=https://github.com/cybericebox/test-exercises
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - run: python3 scripts/package.py
      - name: Publish release archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
