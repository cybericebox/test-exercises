name: Verify and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: mise run lint
      - run: "mise run test ::: package"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cybericebox/backend
          ref: e5a275ca0afac653d92b7f436be6d6e7da4ccb98
          path: _platform
      - run: BACKEND_SOURCE="$GITHUB_WORKSPACE/_platform" bash tools/validate-platform.sh
      - name: Check release image pin
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/check-release.py
  runtime:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f tasks/dynamic/Dockerfile -t cib-test-exercises:local .
      - run: docker build -f tasks/dynamic/Dockerfile --target test-tools -t cib-test-exercises:tools .
      - run: python3 tools/smoke.py
  # The required status check of main: one name that always reports, whatever ran.
  passed:
    name: Check passed
    if: ${{ always() }}
    needs: [contract, runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "* | *" skipped "*) exit 1 ;; esac
  publish:
    timeout-minutes: 25
    if: startsWith(github.ref, 'refs/tags/')
    needs: [contract, runtime]
    runs-on: ubuntu-latest
    concurrency:
      group: docker-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tasks/dynamic/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            cybericebox/test-exercises:${{ github.ref_name }}
            cybericebox/test-exercises:latest
          labels: |
            org.opencontainers.image.source=https://github.com/cybericebox/test-exercises
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - run: python3 tools/package.py
      - name: Publish release archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
