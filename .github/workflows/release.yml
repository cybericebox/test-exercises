name: Verify and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: mise run lint
      - run: "mise run test ::: package"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cybericebox/daemon
          ref: e5a275ca0afac653d92b7f436be6d6e7da4ccb98
          path: _platform
      - run: DAEMON_SOURCE="$GITHUB_WORKSPACE/_platform" bash tools/validate-platform.sh
      - name: Check release image pin
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/check-release.py
  runtime:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f tasks/dynamic/Dockerfile -t cib-test-exercises:local .
      - run: docker build -f tasks/dynamic/Dockerfile --target test-tools -t cib-test-exercises:tools .
      - run: python3 tools/smoke.py
  # The required status check of main: one name that always reports, whatever ran.
  passed:
    name: Check passed
    if: ${{ always() }}
    needs: [contract, runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "* | *" skipped "*) exit 1 ;; esac
  publish:
    timeout-minutes: 25
    if: startsWith(github.ref, 'refs/tags/')
    needs: [contract, runtime]
    runs-on: ubuntu-latest
    concurrency:
      group: docker-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: tasks/dynamic/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            cybericebox/test-exercises:${{ github.ref_name }}
            cybericebox/test-exercises:latest
          labels: |
            org.opencontainers.image.source=https://github.com/cybericebox/test-exercises
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - run: python3 tools/package.py
      - name: Publish release archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
